# FILE:      .github/workflows/stale.yml
# CREATED:   2026-10-21 23:15 +03
# TASK:      596
# AUTHOR:    kwtSMS
# WHAT:      Daily job that marks issues stale after 60 days and pull requests after 30 days without activity, and
#            closes them 14 days later. Issues and PRs labelled pinned or security are exempt.
# WHY:       Keeps the tracker current; same settings as the kwtSMS WHMCS repo.
# USAGE:     Automatic (daily 00:00 UTC).
# DEPENDS:   actions/stale.
# CHANGED:   2026-10-22 12:36 +03: actions/stale v9 -> v11 (Node 24 runtime; Dependabot PR #2), task 596.

name: Stale

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days.
            It will be closed in 14 days if there is no further activity.
          stale-pr-message: >
            This PR has been inactive for 30 days.
            It will be closed in 14 days if there is no further activity.
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security

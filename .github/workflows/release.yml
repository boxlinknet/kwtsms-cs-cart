# FILE:      .github/workflows/release.yml
# CREATED:   2026-10-21 23:09 +03
# TASK:      596
# AUTHOR:    kwtSMS
# WHAT:      On a pushed tag vX.Y.Z, builds the add-on with tools/build-package.sh (every package gate) and publishes a
#            GitHub Release with kwtsms-X.Y.Z.zip, kwtsms-X.Y.Z.tgz and SHA256SUMS, notes from tools/release-notes.sh.
# WHY:       Anyone can download the zip and install it through Add-ons > Manage add-ons > Manual installation,
#            without the Marketplace; same release flow as the other kwtSMS integrations.
# USAGE:     git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z (the tag must equal <version> in addon.xml).
# DEPENDS:   Repository secret PRIVATE_PATTERNS (the lines of the local, gitignored docs/private-patterns.txt): the
#            build's private-pattern gate fails closed without it. Docker on the runner for the PHP 7.4 pass.
# CHANGED:   2026-10-22 12:38 +03: a pre-release tag vX.Y.Z-rc.N is accepted (the part before "-" must equal the
#            addon.xml version; notes come from that CHANGELOG section) so a tester gets the zip as a GitHub
#            pre-release before the final tag; actions/checkout v4 -> v7, softprops/action-gh-release v2 -> v3
#            (Node 24 runtime; Dependabot PRs #1 and #3); full history checkout (fetch-depth 0) so the release zip
#            carries the same entry times, and hash, as a local build, task 596.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must equal the addon.xml version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE="${TAG#v}"
          VERSION="${RELEASE%%-*}"
          XML="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' app/addons/kwtsms/addon.xml | head -1)"
          [ "$VERSION" = "$XML" ] || { echo "tag $TAG does not match addon.xml version $XML"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Private patterns for the package gate
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: |
          [ -n "$PRIVATE_PATTERNS" ] || { echo "secret PRIVATE_PATTERNS is not set"; exit 1; }
          mkdir -p docs
          printf '%s\n' "$PRIVATE_PATTERNS" > docs/private-patterns.txt

      - name: Build the package
        run: bash tools/build-package.sh

      # 2026-10-22 12:43 +03: short notes from the README (features, requirements, install, configuration) plus a
      # CHANGELOG link, the format of the other kwtSMS releases, instead of the whole CHANGELOG section, task 596.
      - name: Release notes
        env:
          RELEASE: ${{ steps.version.outputs.release }}
        run: bash tools/release-notes.sh "$RELEASE" > notes.md

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: kwtSMS for CS-Cart v${{ steps.version.outputs.release }}
          body_path: notes.md
          files: |
            dist/kwtsms-${{ steps.version.outputs.version }}.zip
            dist/kwtsms-${{ steps.version.outputs.version }}.tgz
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

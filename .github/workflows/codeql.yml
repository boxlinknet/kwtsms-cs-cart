# FILE:      .github/workflows/codeql.yml
# CREATED:   2026-10-21 23:15 +03
# TASK:      596
# AUTHOR:    kwtSMS
# WHAT:      CodeQL scan of the JavaScript the add-on ships (js/addons/kwtsms/) and of the GitHub Actions workflows,
#            on push to main, on pull requests and every Monday 06:00 UTC.
# WHY:       Same code-scanning baseline as the other kwtSMS repos. CodeQL has no PHP support, so PHP is covered by
#            phpcs in ci.yml and by the security greps in tools/build-package.sh.
# USAGE:     Automatic. Results appear on the repository Security tab > Code scanning.
# DEPENDS:   GitHub code scanning (free on public repositories).
# CHANGED:   2026-10-22 12:36 +03: actions/checkout v4 -> v7 (Node 24 runtime), as in ci.yml, task 596.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

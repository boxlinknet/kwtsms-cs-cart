# FILE:      .github/dependabot.yml
# CREATED:   2026-10-21 23:15 +03
# TASK:      596
# AUTHOR:    kwtSMS
# WHAT:      Weekly Dependabot updates (Monday) for the Composer dev tooling and the GitHub Actions versions.
# WHY:       Keeps phpcs, PHPCompatibility, PHPUnit and the workflow actions current; same layout as the other
#            kwtSMS repos. The add-on itself ships without Composer dependencies.
# USAGE:     Read by GitHub automatically.
# DEPENDS:   composer.json, composer.lock, .github/workflows/.
# CHANGED:   2026-10-22 13:09 +03: open-pull-requests-limit 0 for both ecosystems: Boss rule, no pull requests on
#            this repository, direct edits only. Dependabot still checks and raises security alerts; updates are
#            applied by a direct commit (automated security-fix PRs are switched off in the repo settings), task 596.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
